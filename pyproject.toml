[project]
name = "notes2obsidian"
version = "0.1.0"
description = "App to transform files (images/pdf) in structured data format in order to be read from Obsidian"
readme = "README.md"
authors = [
    { name = "Renato", email = "renato.gutierrez.maulme@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "marker-pdf[full]>=2.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-telegram-bot>=22.8",
]

[project.scripts]
notes2obsidian = "notes2obsidian.bot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"


